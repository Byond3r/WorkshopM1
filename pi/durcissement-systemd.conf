# Durcissement des services sentinel et sentinel-capteurs : équivalent systemd du cap_drop: ALL,
# no-new-privileges et read_only de Docker. Fichier « drop-in » : il complète le .service sans le modifier.
# Installation : /etc/systemd/system/<service>.service.d/durcissement.conf
# Retour arrière : supprimer ce fichier, puis sudo systemctl daemon-reload && sudo systemctl restart <service>
[Service]
# Le service ne peut jamais gagner de privilèges (sudo, programmes setuid…), même s'il est piraté
NoNewPrivileges=yes
# Aucune capacité root, même partielle : ces services n'en ont pas besoin (ports > 1024, GPIO via le groupe gpio)
CapabilityBoundingSet=
# /usr, /boot et /etc en lecture seule pour le service
ProtectSystem=full
# /tmp privé : le service ne voit pas les fichiers temporaires des autres programmes
PrivateTmp=yes
# Limite de mémoire : un emballement ne peut pas saturer les 2 Go du Pi
MemoryMax=400M
